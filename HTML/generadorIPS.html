<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de IPS</title>
    <link rel="stylesheet" href="../CSS/generadorIPS.css" />
    <script src="../JS/generadorIPS.js" defer></script>
  </head>
  <body>
    <header></header>

    <main class="contenedor">
      <h1>Generador de direcciones IP.</h1>

      <p>Simulador de una red domestica IPv4.</p>

      <section>
        <h2>Generador de direcciones IP</h2>

        <p>Red simulada : <strong>192.168.1.0/24</strong></p>

        <button onclick="generarIP()">Generar IP aleatoria</button>
        <button onclick="mostrarDireccionRed()">
          Mostrar dirección de red
        </button>
        <button onclick="mostrarPuertaEnlace()">
          Mostrar puerta de enlace
        </button>
        <button onclick="mostrarBroadcast()">Mostrar broadcast</button>
        <button onclick="mostrarMascara()">Mostrar máscara de subred</button>

        <p id="ip">0.0.0.0</p>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
